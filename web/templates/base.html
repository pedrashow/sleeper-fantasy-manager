<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sleeper Fantasy Manager{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <nav class="topnav">
        <a href="/" class="nav-brand">SFM</a>
        <div class="nav-links">
            <a href="/" class="{% if active_page == 'home' %}active{% endif %}">Home</a>
            <a href="/health" class="{% if active_page == 'health' %}active{% endif %}">Health</a>
            <a href="/player" class="{% if active_page == 'player' %}active{% endif %}">Player</a>
            <a href="/rankings" class="{% if active_page == 'rankings' %}active{% endif %}">Rankings</a>
            <a href="/draft" class="{% if active_page == 'draft' %}active{% endif %}">Draft</a>
            <a href="/waivers" class="{% if active_page == 'waivers' %}active{% endif %}">Waivers</a>
            <a href="/roster" class="{% if active_page == 'roster' %}active{% endif %}">Roster</a>
            <a href="/portfolio" class="{% if active_page == 'portfolio' %}active{% endif %}">Portfolio</a>
        </div>
    </nav>

    <main class="container {% block container_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
